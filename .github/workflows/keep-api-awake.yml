name: Keep the API awake

# Render's free plan puts the API to sleep after about 15 minutes without a request, and the first
# request afterwards takes up to a minute. This asks it a tiny question every 10 minutes so it stays
# awake for the app. (GitHub pauses scheduled runs after 60 days without any activity in the repo;
# open the Actions tab and re-enable it if that ever happens.) Remove this file when the API moves
# to a paid plan.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API if it is there
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://goal-tcrb.onrender.com/health
