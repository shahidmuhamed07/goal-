<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Path Loader Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-emerald-100: #d1fae5;
      --color-emerald-500: #10b981;
      --color-emerald-600: #059669;
      --color-emerald-700: #047857;
      --ease-glide: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {
      background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .loader-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gp-loader-logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gp-loader-logo-box {
      width: 96px;
      height: 96px;
      filter: drop-shadow(0 8px 20px rgba(16, 185, 129, 0.3));
    }

    /* Glowing snake segment that animates */
    @keyframes gp-loader-snake-glow {
      from {
        stroke-dashoffset: 0;
        stroke-opacity: 0.5;
      }
      to {
        stroke-dashoffset: -120;
        stroke-opacity: 1;
      }
    }

    .gp-loader-snake {
      stroke-dasharray: 25 95;
      animation: gp-loader-snake-glow 2s linear infinite;
    }

    /* Logo breathing animation */
    @keyframes gp-loader-breathe {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.02);
      }
    }

    .gp-loader-mark {
      transform-origin: center;
      animation: gp-loader-breathe 3.4s var(--ease-glide) infinite;
      position: relative;
      z-index: 10;
    }

    .logo-box {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981 0%, #0d9488 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 48px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .info {
      margin-top: 40px;
      text-align: center;
      color: #4b5563;
    }

    .info h2 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #1e293b;
    }

    .info p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div>
    <div class="loader-container">
      <!-- Logo with animation inside -->
      <div class="gp-loader-mark gp-loader-logo-wrapper">
        <svg
          width="96"
          height="96"
          viewBox="0 0 96 96"
          fill="none"
          class="gp-loader-logo-box"
          aria-hidden="true"
        >
          <!-- Background box -->
          <rect width="96" height="96" rx="16" fill="url(#logoGradient)" />

          <!-- Winding snake path inside the logo -->
          <!-- Faint track -->
          <path
            d="M 48 12 Q 28 24, 28 40 Q 28 56, 48 68 Q 68 80, 48 84"
            stroke="rgba(255, 255, 255, 0.3)"
            stroke-width="3"
            stroke-linecap="round"
            fill="none"
          />

          <!-- Animated glowing segment -->
          <path
            d="M 48 12 Q 28 24, 28 40 Q 28 56, 48 68 Q 68 80, 48 84"
            stroke="rgba(255, 255, 255, 0.9)"
            stroke-width="3"
            stroke-linecap="round"
            fill="none"
            class="gp-loader-snake"
          />

          <!-- Travelling dot -->
          <circle r="2.5" fill="white" class="gp-loader-snake-dot">
            <animateMotion
              dur="2s"
              repeatCount="indefinite"
              path="M 48 12 Q 28 24, 28 40 Q 28 56, 48 68 Q 68 80, 48 84"
            />
          </circle>

          <!-- Gradient definition -->
          <defs>
            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="100%" stop-color="#0d9488" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>

    <div class="info">
      <h2>Loading your goals...</h2>
      <p>
        Snake travels inside the logo<br>
        showing activity while loading
      </p>
    </div>
  </div>
</body>
</html>
